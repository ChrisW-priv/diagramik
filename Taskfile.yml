version: "3"

includes:
  fe:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
  be:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  infra:
    taskfile: ./infrastructure/Taskfile.yml
    dir: ./infrastructure

tasks:
  default:
    desc: List all available tasks
    cmds:
      - go-task --list-all

  init:
    decs: Initializes the environment
    deps:
      - fe:install
      - be:sync
      - infra:init

  check:
    desc: Runs static type checks to make sure any obvious errors are not present
    cmds:
      - task: fe:check
      - task: be:monolith:check-prod

  setup:
    desc: Set up local development environment
    cmds:
      - task: be:monolith:setup-local

  dev:
    desc: Runs dev env for frontend and backend
    deps:
      - fe:dev
      - be:dev
