[project]
name = "renderer"
version = "0.1.0"
description = "Shared rendering library for Mermaid and architecture diagrams"
requires-python = ">=3.13"
dependencies = [
    "diagrams>=0.24.4",
    "google-cloud-storage>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renderer"]
